pre-commit:
  parallel: true
  commands:
    linter:
      glob: "*.{js,jsx,ts,tsx}"
      run: yarn lint
    format:
      glob: "*.{js,jsx,ts,tsx,json,css,scss}"
      run: yarn exec biome check --write {staged_files}
    # tests:
    #   run: yarn run test --passWithNoTests --findRelatedTests {staged_files}

commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}
